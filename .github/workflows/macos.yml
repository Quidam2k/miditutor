name: macOS

# Run only manually or on version tags; branch pushes and pull requests consume paid private-repo minutes.
# Unsigned, not notarized: the zip is a build artifact only. Gatekeeper needs a manual "Open Anyway" on the target Mac.
# Green on macos-14 (runs 37842684233, 40234143238); scripts/deploy_pinocchio.sh installs its artifact on Pinocchio.
on:
  workflow_dispatch:
    inputs:
      runner:
        description: macOS runner image (arm64), for when one image's queue is stuck (2026-10-28)
        default: macos-14
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  macos:
    runs-on: ${{ inputs.runner || 'macos-14' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Step timeout (not just job timeout) so a hang still leaves a readable log.
      - run: npm ci --foreground-scripts --loglevel=http
        timeout-minutes: 15

      - run: npx tsc --noEmit

      - run: npx vitest run

      - run: npx electron-forge make --platform=darwin --arch=arm64

      - name: Headless launch smoke
        run: bash .github/scripts/macos-smoke.sh
        env:
          MIDITUTOR_HIDDEN: "1"

      - uses: actions/upload-artifact@v4
        with:
          name: MidiTutor-macos-arm64
          path: out/make/zip/darwin/arm64/*.zip
          if-no-files-found: error
          retention-days: 14

